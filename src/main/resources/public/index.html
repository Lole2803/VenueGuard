<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>VenueGuard</title>
  <link rel='stylesheet' href='style.css'>
  <script src='https://cdn.jsdelivr.net/npm/sweetalert2@11'></script>
</head>
<body>
  <header>
    <h1>VenueGuard</h1>
    <p>Book a venue and avoid clashes.</p>
  </header>

  <main>
    <div id='message'></div>

    <section class='card'>
      <h2>Venues</h2>
      <div class='table-wrap'>
        <table>
          <thead><tr><th>Name</th><th>Capacity</th><th>Location</th><th>Max hours per booking</th></tr></thead>
          <tbody id='venueRows'></tbody>
        </table>
      </div>
    </section>

    <section class='card'>
      <h2 id='formTitle'>New booking</h2>
      <form id='bookingForm'>
        <label>Venue
          <select id='venueName'></select>
          <small id='venueHint'></small>
        </label>
        <label>Your name <input type='text' id='bookerName' required></label>
        <label>Date <input type='date' id='date' required></label>
        <label>Start hour (0-23) <input type='number' id='startHour' min='0' max='23' required></label>
        <label>End hour (1-24) <input type='number' id='endHour' min='1' max='24' required></label>
        <button type='submit' id='saveButton'>Book venue</button>
        <button type='button' id='cancelEditButton' class='secondary' style='display:none'>Stop editing</button>
      </form>
    </section>

    <section class='card'>
      <h2>Bookings</h2>
      <div class='table-wrap'>
        <table>
          <thead><tr><th>ID</th><th>Venue</th><th>Booked by</th><th>Date</th><th>From</th><th>To</th><th>Actions</th></tr></thead>
          <tbody id='bookingRows'></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src='app.js'></script>
</body>
</html>
